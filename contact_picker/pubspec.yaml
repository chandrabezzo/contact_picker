name: fluttercontactpicker_plus
description: Use Androids' and iOS' native contact pickers to chose phone numbers and email addresses from contacts of the users address book
version: 5.1.0
git: https://github.com/chandrabezzo/contact_picker
homepage: https://github.com/chandrabezzo/contact_picker

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  contact_picker_platform_interface: ^5.0.0
  contact_picker_web: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: me.schlaubi.fluttercontactpicker
        pluginClass: FlutterContactPickerPlugin
      ios:
        pluginClass: FlutterContactPickerPlugin
      web:
        default_package: contact_picker_web
